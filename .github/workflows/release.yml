name: Build downloads

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name mary mary.py
      - name: Assemble the folder
        shell: bash
        run: |
          mkdir -p pkg/Mary
          cp dist/mary* pkg/Mary/
          cp -r thelady pkg/Mary/thelady
          cp index.html MARY_AI_GUIDE.md pkg/Mary/
      - name: Zip
        shell: bash
        run: |
          cd pkg
          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a ../Mary-${{ matrix.name }}.zip Mary
          else
            zip -r ../Mary-${{ matrix.name }}.zip Mary
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Mary-${{ matrix.name }}
          path: Mary-${{ matrix.name }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: Mary-*.zip
